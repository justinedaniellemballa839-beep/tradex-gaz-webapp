{% extends 'base.html' %}

{% block title %}Laisser un avis - Tradex Distrib'IA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4 text-center">Ton avis sur {{ produit.nom }}</h1>

        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100">Envoyer mon avis</button>
        </form>
    </div>
</div>
{% endblock %}
