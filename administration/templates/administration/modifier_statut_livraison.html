{% extends 'base.html' %}

{% block title %}Modifier statut - Tradex Distrib'IA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="mb-4 text-center">Livraison - Commande #{{ livraison.commande.id }}</h1>
        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'gerer_livraisons' %}">← Retour aux livraisons</a>
        </div>
    </div>
</div>
{% endblock %}
