{% extends 'base.html' %}

{% block title %}Passer une commande - Tradex Distrib'IA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4 text-center">Passer une commande</h1>

        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100">Continuer vers le paiement</button>
        </form>
    </div>
</div>
{% endblock %}
